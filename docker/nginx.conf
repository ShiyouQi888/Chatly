server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location ^~ /api/ {
    proxy_pass http://server:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location ^~ /uploads/ {
    proxy_pass http://server:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  location = /health {
    proxy_pass http://server:3002/health;
    proxy_set_header Host $host;
  }

  location /ws {
    access_log off;
    proxy_pass http://server:3002;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Service Worker 必须每次回源校验。
  # 下面的静态资源规则会把 .js 缓存 7 天，而 /sw.js 也以 .js 结尾 ——
  # 不单独开一条精确匹配的话，用户会连续一周跑旧版 SW：推送逻辑修好了、
  # 通知却还是按老逻辑走，而且「清缓存」都不一定管用（SW 有自己的存储）。
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    expires -1;
    try_files $uri =404;
  }

  # PWA manifest 改动频率低，但也不能跟着 .js/.png 缓 7 天
  location = /manifest.webmanifest {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  location ~* \.(?:css|js|svg|png|jpe?g|gif|webp|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }
}

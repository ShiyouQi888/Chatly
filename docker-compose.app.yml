# 独立的完整部署栈，不与开发用 docker-compose.yml 共用数据库卷。
# docker compose -f docker-compose.app.yml up --build -d
name: chatly-production

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录 .env 设置 POSTGRES_PASSWORD}
      POSTGRES_DB: chatly
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - prod-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatly -d chatly"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prod-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
      TRUST_PROXY_HOPS: 1
      DB_DRIVER: postgres
      DATABASE_URL: postgres://chatly:${POSTGRES_PASSWORD:?请在项目根目录 .env 设置 POSTGRES_PASSWORD}@postgres:5432/chatly
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?请在项目根目录 .env 设置 JWT_SECRET}
      AUTH_OTP_SECRET: ${AUTH_OTP_SECRET:?请在项目根目录 .env 设置 AUTH_OTP_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME:-运营管理员}
      MESSAGE_ENCRYPTION_KEY: ${MESSAGE_ENCRYPTION_KEY:-}
      TENCENT_MAP_KEY: ${TENCENT_MAP_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      WEB_PUSH_VAPID_PUBLIC_KEY: ${WEB_PUSH_VAPID_PUBLIC_KEY:-}
      WEB_PUSH_VAPID_PRIVATE_KEY: ${WEB_PUSH_VAPID_PRIVATE_KEY:-}
      WEB_PUSH_VAPID_SUBJECT: ${WEB_PUSH_VAPID_SUBJECT:-}
      WEBRTC_STUN_URLS: ${WEBRTC_STUN_URLS:-}
      WEBRTC_TURN_URLS: ${WEBRTC_TURN_URLS:-}
      WEBRTC_TURN_SHARED_SECRET: ${WEBRTC_TURN_SHARED_SECRET:-}
    volumes:
      - prod-uploads:/app/uploads
      - prod-private-uploads:/app/private-uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 5

  # TURN 中继：对称 NAT / 企业网封 UDP 时唯一能救通话的一环。
  # 不部署的话，两端都在对称 NAT 后面时 WebRTC 会一直卡在「正在接通」。
  #
  # 端口：3478 (UDP/TCP) + 49160-49200 (UDP 中继段)。
  # 中继段刻意收窄到 40 个端口——每通视频通话占 2 个，够几十路并发，
  # 又不至于让防火墙要开 3 万个 UDP 端口。
  turn:
    image: coturn/coturn:4.6-alpine
    restart: unless-stopped
    # 用 host 网络最省事（TURN 的 UDP 端口范围映射在桥接网络下很啰嗦），
    # 但 Windows/macOS 的 Docker Desktop 不支持 host 网络，所以这里用端口映射，
    # Linux 生产环境可以把下面的 ports 删掉、改成 network_mode: host。
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    command:
      - --listening-port=3478
      - --fingerprint
      - --lt-cred-mech
      # 短期凭证：与 server 的 WEBRTC_TURN_SHARED_SECRET 必须是同一个值，
      # 算法是 HMAC-SHA1(secret, "过期时间:用户id")，见 server/src/routes/calls.js
      - --use-auth-secret
      - --static-auth-secret=${WEBRTC_TURN_SHARED_SECRET:?请设置 WEBRTC_TURN_SHARED_SECRET（TURN 与 server 共用）}
      - --realm=chatly
      # 公网 IP。**部署到云主机时一定要取消注释并填写** ——
      # 不填的话 coturn 自己探测，在 NAT 后面常常探测成内网地址，
      # 客户端拿到的中继候选不可达，表现是「一直正在接通」。
      # - --external-ip=${TURN_EXTERNAL_IP}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --no-cli
      - --stale-nonce=600
      # 默认不开 TLS。要支持 turns:（企业网只放行 443 时的保命通道）：
      #   1) 把证书挂进来：./docker/turn/certs/fullchain.pem 与 privkey.pem
      #   2) 把 --no-tls 换成：
      #      - --tls-listening-port=5349
      #      - --cert=/etc/coturn/certs/fullchain.pem
      #      - --pkey=/etc/coturn/certs/privkey.pem
      #   3) ports 增加 "5349:5349/tcp"
      - --no-tls

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_TMAP_KEY: ${VITE_TMAP_KEY:-}
    restart: unless-stopped
    ports:
      - "${CHATLY_BIND_ADDRESS:-127.0.0.1}:${CHATLY_HTTP_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy

volumes:
  prod-postgres:
  prod-redis:
  prod-uploads:
  prod-private-uploads:
